<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Espresso & Obsidian Luxury Gradient -->
    <linearGradient id="crestBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261E18"/>
      <stop offset="50%" stop-color="#1A1410"/>
      <stop offset="100%" stop-color="#100C09"/>
    </linearGradient>

    <!-- 24k Radiant Gold Gradient -->
    <linearGradient id="goldLuster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D6"/>
      <stop offset="35%" stop-color="#F2D08A"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C5D23"/>
    </linearGradient>

    <!-- Platinum Highlight -->
    <linearGradient id="champagneGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F2D08A" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Zenith Star Glow -->
    <radialGradient id="starHalo" cx="50%" cy="26%" r="35%">
      <stop offset="0%" stop-color="#FFEBB8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Drop Shadow -->
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#crestBase)"/>
  
  <!-- Outer Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#goldLuster)" stroke-width="8" stroke-opacity="0.9"/>
  <rect x="36" y="36" width="440" height="440" rx="98" fill="none" stroke="#FAF8F5" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Glowing Ambient Star Bloom -->
  <circle cx="256" cy="155" r="110" fill="url(#starHalo)" filter="url(#luxuryGlow)"/>

  <!-- Grand Architectural Archway (Gateway) -->
  <path d="M 145 410 L 145 245 C 145 182, 195 132, 256 132 C 317 132, 367 182, 367 245 L 367 410" 
        stroke="url(#goldLuster)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Inner Architectural Contour -->
  <path d="M 190 410 L 190 260 C 190 223, 220 193, 256 193 C 292 193, 322 223, 322 260 L 322 410" 
        stroke="url(#goldLuster)" stroke-width="8" stroke-dasharray="10 14" stroke-opacity="0.65" fill="none"/>

  <!-- Ascending Central Pathway Line -->
  <path d="M 256 420 L 256 270" stroke="url(#goldLuster)" stroke-width="12" stroke-linecap="round"/>

  <!-- Perspective Pathway Rays -->
  <path d="M 225 410 L 245 325 M 287 410 L 267 325" stroke="url(#goldLuster)" stroke-width="7" stroke-opacity="0.75" stroke-linecap="round"/>

  <!-- Polaris Guiding 8-Point Zenith Star -->
  <!-- Vertical Beam -->
  <path d="M 256 70 L 268 128 L 256 186 L 244 128 Z" fill="url(#goldLuster)"/>
  <!-- Horizontal Beam -->
  <path d="M 198 128 L 256 116 L 314 128 L 256 140 Z" fill="url(#goldLuster)"/>
  <!-- Diagonal Flares -->
  <path d="M 220 92 L 243 120 L 292 164 L 269 136 Z" fill="#FFF4D6" opacity="0.85"/>
  <path d="M 292 92 L 269 120 L 220 164 L 243 136 Z" fill="#FFF4D6" opacity="0.85"/>

  <!-- Brilliant Center Diamond -->
  <circle cx="256" cy="128" r="11" fill="#FFFFFF"/>

  <!-- Top Glass Highlight Specular Arc -->
  <path d="M 60 80 Q 256 40 452 80" stroke="url(#champagneGlow)" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
