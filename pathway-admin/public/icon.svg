<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2824"/>
      <stop offset="50%" stop-color="#1E1A17"/>
      <stop offset="100%" stop-color="#14110F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D59B"/>
      <stop offset="50%" stop-color="#C9944A"/>
      <stop offset="100%" stop-color="#9C6B28"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Glowing background orb -->
  <circle cx="256" cy="230" r="140" fill="url(#gold)" opacity="0.15" filter="url(#glow)"/>

  <!-- Pathway 'P' Monogram -->
  <path d="M 180 120 
           L 290 120 
           C 355 120, 395 158, 395 220 
           C 395 282, 355 320, 290 320 
           L 242 320 
           L 242 392 
           L 180 392 
           Z 
           M 242 178 
           L 242 262 
           L 286 262 
           C 318 262, 336 248, 336 220 
           C 336 192, 318 178, 286 178 
           Z" 
        fill="url(#gold)"/>

  <!-- Compass / Star spark accent -->
  <polygon points="370,130 380,145 405,145 385,158 392,180 370,165 348,180 355,158 335,145 360,145" 
           fill="#F3D59B" opacity="0.8"/>
</svg>
